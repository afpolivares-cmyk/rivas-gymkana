<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16803c">
  <title>Juego por la Educación Pública</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --green: #16803c;
      --green-dark: #0f6330;
      --green-light: #e8f5ec;
      --ink: #202820;
      --muted: #657168;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
    body { overflow: hidden; }

    /* Pantalla de bienvenida */
    #welcome {
      position: fixed; inset: 0; z-index: 3000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 28px 20px; overflow-y: auto;
      background: var(--green); color: #fff; text-align: center;
    }
    #welcome h1 {
      max-width: 850px; margin: 0; font-size: clamp(2rem, 7vw, 4.4rem);
      line-height: 1.04; letter-spacing: .015em;
    }
    #welcome p { max-width: 620px; margin: 0; font-size: clamp(1.1rem, 3.5vw, 1.55rem); line-height: 1.45; }
    #welcome .doll-wrap { width: 154px; height: 212px; }
    #startButton {
      border: 2px solid #fff; border-radius: 999px; padding: 14px 38px;
      background: #fff; color: var(--green-dark); font-size: 1.12rem; font-weight: 700;
      cursor: pointer; min-width: 170px;
    }
    #startButton:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #f2c94c; outline-offset: 3px; }

    /* Mapa */
    #game { display: none; position: fixed; inset: 0; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-header {
      position: absolute; z-index: 700; top: 12px; left: 50%; transform: translateX(-50%);
      width: min(92vw, 420px); padding: 10px 14px; border-radius: 14px;
      background: rgba(255,255,255,.96); box-shadow: 0 2px 14px #0002; text-align: center;
    }
    .map-header strong { display: block; font-size: .98rem; }
    #progress { margin-top: 4px; color: var(--muted); font-size: .88rem; }
    #gpsStatus { margin-top: 5px; color: var(--muted); font-size: .78rem; line-height: 1.25; }

    /* Muñeco fijo: el tamaño no depende del zoom del mapa */
    #dollCard {
      position: absolute; z-index: 750; right: 12px; bottom: 12px;
      width: 142px; padding: 7px 7px 5px; border-radius: 15px;
      background: rgba(255,255,255,.96); box-shadow: 0 2px 14px #0003;
      text-align: center; pointer-events: none;
    }
    #dollCard .doll-wrap { width: 124px; height: 166px; margin: 0 auto; }
    #dollCaption { font-size: .72rem; font-weight: 700; color: var(--green-dark); }

    /* Muñeco SVG y prendas */
    .doll-svg { width: 100%; height: 100%; overflow: visible; }
    .clothing { display: none; }
    .doll-svg.level-1 #shirt { display: inline; }
    .doll-svg.level-2 #shirt, .doll-svg.level-2 #pants { display: inline; }
    .doll-svg.level-3 #shirt, .doll-svg.level-3 #pants, .doll-svg.level-3 #socks { display: inline; }
    .doll-svg.level-4 #shirt, .doll-svg.level-4 #pants, .doll-svg.level-4 #socks, .doll-svg.level-4 #hat { display: inline; }
    .doll-svg.level-5 #shirt, .doll-svg.level-5 #pants, .doll-svg.level-5 #socks, .doll-svg.level-5 #hat, .doll-svg.level-5 #shoes { display: inline; }
    .doll-svg.level-6 #shirt, .doll-svg.level-6 #pants, .doll-svg.level-6 #socks, .doll-svg.level-6 #hat, .doll-svg.level-6 #shoes, .doll-svg.level-6 #hoodie { display: inline; }
    .doll-svg.level-7 #shirt, .doll-svg.level-7 #pants, .doll-svg.level-7 #socks, .doll-svg.level-7 #hat, .doll-svg.level-7 #shoes, .doll-svg.level-7 #hoodie, .doll-svg.level-7 #gloves { display: inline; }
    .doll-svg.level-8 .clothing { display: inline; }

    /* Marcadores vacíos */
    .empty-marker {
      width: 25px; height: 25px; border-radius: 50%;
      background: #c9c9c9; border: 3px solid #777;
      box-shadow: 0 1px 5px #0005;
    }
    .empty-marker.done { background: #22a447; border-color: #116b2d; }

    /* Pregunta y pantallas de respuesta */
    .overlay {
      position: fixed; inset: 0; z-index: 2000; display: none;
      align-items: center; justify-content: center; padding: 22px;
      background: rgba(12, 25, 16, .72);
    }
    .dialog {
      width: min(100%, 620px); max-height: min(88vh, 850px); overflow-y: auto;
      background: #fff; border-radius: 18px; padding: clamp(22px, 5vw, 36px);
      box-shadow: 0 10px 40px #0004;
    }
    .dialog h2 { margin: 0 0 12px; color: var(--green-dark); font-size: clamp(1.5rem, 5vw, 2rem); }
    .dialog p { line-height: 1.5; }
    .dialog .question { font-size: 1.16rem; font-weight: 700; }
    .dialog input {
      width: 100%; padding: 13px 14px; margin: 8px 0 12px; border: 1px solid #b9c4bb;
      border-radius: 9px; font-size: 1.05rem;
    }
    .primary-button {
      border: 0; border-radius: 999px; padding: 13px 25px; background: var(--green);
      color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .feedback { min-height: 1.35em; margin: 7px 0 0; color: #9a2d22; font-size: .9rem; }
    #successOverlay { z-index: 2500; background: #fff; color: var(--ink); overflow-y: auto; }
    #successContent { width: min(100%, 760px); max-height: 100%; overflow-y: auto; padding: 28px 22px; text-align: left; }
    #successTitle { margin: 0 0 18px; color: var(--green); text-align: center; font-size: clamp(2rem, 7vw, 3.2rem); }
    #successText { font-size: clamp(.98rem, 2.5vw, 1.1rem); line-height: 1.55; }
    #successText h3 { color: var(--green-dark); font-size: 1.35rem; margin: 0 0 15px; }
    #successText p { margin: 0 0 13px; }
    #successText strong { font-weight: 700; }
    #continueButton { display: block; margin: 22px auto 0; min-width: 150px; }

    @media (max-width: 520px) {
      #dollCard { width: 112px; right: 8px; bottom: 8px; padding: 5px; }
      #dollCard .doll-wrap { width: 96px; height: 132px; }
      #dollCaption { font-size: .65rem; }
      .map-header { top: 8px; }
      .leaflet-bottom.leaflet-right { bottom: 145px; }
    }
  </style>
</head>
<body>

  <section id="welcome">
    <h1>JUEGO POR LA EDUCACIÓN PÚBLICA</h1>
    <p>Ve a las distintas localizaciones y consigue vestir al muñeco completamente.</p>
    <div class="doll-wrap" id="welcomeDoll"></div>
    <button id="startButton">Comenzar</button>
  </section>

  <main id="game">
    <div id="map" aria-label="Mapa interactivo de Rivas-Vaciamadrid"></div>
    <div class="map-header">
      <strong>JUEGO POR LA EDUCACIÓN PÚBLICA</strong>
      <div id="progress">Ubicaciones completadas: 0 de 8</div>
      <div id="gpsStatus">Selecciona un punto del mapa para comprobar tu ubicación.</div>
    </div>
    <aside id="dollCard">
      <div class="doll-wrap" id="mapDoll"></div>
      <div id="dollCaption">¡Vísteme!</div>
    </aside>
  </main>

  <section id="questionOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="questionTitle">
    <div class="dialog">
      <h2 id="questionTitle">Pista</h2>
      <p id="questionText" class="question"></p>
      <p id="locationStatus" class="feedback" style="color:#53645a"></p>
      <form id="answerForm">
        <label for="answerInput">Escribe tu respuesta:</label>
        <input id="answerInput" type="text" autocomplete="off" required>
        <button class="primary-button" id="answerButton" type="submit">Comprobar respuesta</button>
      </form>
      <p id="answerFeedback" class="feedback" aria-live="polite"></p>
    </div>
  </section>

  <section id="successOverlay" class="overlay" role="dialog" aria-modal="true">
    <div id="successContent">
      <h1 id="successTitle">Correcto</h1>
      <div id="successText"></div>
      <button class="primary-button" id="continueButton">Continuar</button>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const RADIO_METROS = 10;
    const PRECISION_MAXIMA = 10;
    const STORAGE_KEY = "juegoEducacionPublicaRivas_v1";

    const lugares = [
      {
        id: "picasso", nombre: "Plaza Pablo Picasso",
        lat: 40.364390, lng: -3.549775,
        pregunta: "¿Apellido del pintor da nombre a esta plaza y que pintó el Guernica?",
        respuestas: ["picasso"]
      },
      {
        id: "reloj", nombre: "Reloj de Sol Villacís",
        lat: 40.361005, lng: -3.550990,
        pregunta: "¿Cuál es el primer número romano que aparece en este reloj de Sol (el más pequeño)?",
        respuestas: ["vi"]
      },
      {
        id: "parque-fotos", nombre: "Parque lineal",
        lat: 40.366427, lng: -3.546937,
        pregunta: "¿Cuál es el animal que más se repite en las fotografías expuestas?",
        respuestas: ["perro"]
      },
      {
        id: "covibar", nombre: "Centro Cívico Covibar",
        lat: 40.365180, lng: -3.549676,
        pregunta: "¿Quién es el personaje del libro más famoso en castellano representado sobre un caballo en esta imagen?",
        respuestas: ["don quijote", "quijote", "don quijote de la mancha"]
      },
      {
        id: "sol", nombre: "Calle del Sol",
        lat: 40.358069, lng: -3.546793,
        pregunta: "Uno de los dioses más importantes del antiguo Egipto fue Ra, quien era el dios del … (Pista: Una calle cercana contiene la palabra que buscas)",
        respuestas: ["sol"]
      },
      {
        id: "parque-bancos", nombre: "Parque lineal",
        lat: 40.361503, lng: -3.543919,
        pregunta: "¿Cuántos bancos existen bajo la parte techada? ¡Tienes que ponerte de pie sobre cada uno de ellos para contarlos!",
        respuestas: ["6", "seis"]
      },
      {
        id: "juventud", nombre: "Casa de la Juventud",
        lat: 40.363516, lng: -3.550564,
        pregunta: "¿A qué juego se juega en esta zona? Si no lo conoces, ¡pregunta cómo se juega y prueba una partida!",
        respuestas: ["petanca"]
      },
      {
        id: "polideportivo", nombre: "Polideportivo Cerro del Telégrafo",
        lat: 40.357722, lng: -3.545507,
        pregunta: "¿Cuántas pistas de tenis a cielo abierto existen en este espacio?",
        respuestas: ["5", "cinco"]
      }
    ];

    // Los mensajes se asignan por orden de acierto, no por el orden de las ubicaciones.
    const mensajes = [
      `<h3>¿Sabías que...?</h3>
       <p><strong>Cuantos menos alumnos hay en un aula, más oportunidades tiene cada uno de aprender?</strong></p>
       <p>Con grupos más pequeños, el profesorado puede atender mejor las dudas, detectar dificultades, acompañar a cada alumno y prevenir conflictos. En definitiva, nadie se queda atrás por falta de atención.</p>
       <p><strong>Reducir las ratios no es un privilegio del profesorado: es mejorar la educación de nuestros hijos e hijas.</strong></p>
       <p>Porque una clase con menos alumnos es una clase con más oportunidades.</p>
       <p><strong>¡Esta reivindicación también es vuestra!</strong></p>`,

      `<h3>¿Sabías que...?</h3>
       <p><strong>Hay alumnos que necesitan un apoyo extra para poder aprender en igualdad de condiciones?</strong></p>
       <p>Algunos niños necesitan ayuda especializada para superar dificultades de aprendizaje, comunicarse mejor o seguir el ritmo de la clase. Para eso están los profesores de apoyo, que trabajan con ellos y junto al resto de docentes.</p>
       <p>Pero cuando faltan estos profesionales, muchos alumnos no reciben la atención que necesitan y sus dificultades pueden hacerse mayores.</p>
       <p><strong>Reclamar más profesores de apoyo no es pedir un privilegio: es defender que ningún niño se quede atrás por no recibir la ayuda que necesita.</strong></p>
       <p>Porque todos nuestros hijos merecen las mismas oportunidades.</p>
       <p><strong>¡Esta reivindicación también es vuestra!</strong></p>`,

      `<h3>¿Sabías que...?</h3>
       <p><strong>Cada vez más adolescentes necesitan ayuda para afrontar problemas emocionales y de salud mental?</strong></p>
       <p>Ansiedad, tristeza, problemas de autoestima, dificultades familiares... En los institutos, los orientadores son fundamentales para escuchar, detectar problemas a tiempo y ayudar a quienes lo necesitan.</p>
       <p>Pero cuando hay pocos orientadores para cientos de alumnos, no llegan a todos. Se ven obligados a priorizar los casos más graves, dejando a muchos otros sin la atención que necesitan hasta que su situación empeora.</p>
       <p><strong>Necesitamos más orientadores para poder prevenir y acompañar, no solo intervenir cuando el problema ya es grave.</strong></p>
       <p>Porque la salud mental de nuestros hijos también merece atención.</p>
       <p><strong>¡Esta reivindicación también es vuestra!</strong></p>`,

      `<h3>¿Sabías que...?</h3>
       <p><strong>Nuestros hijos pasan muchas horas al día en aulas que no siempre tienen unas condiciones adecuadas de temperatura?</strong></p>
       <p>En verano, las aulas pueden alcanzar temperaturas muy elevadas y, en invierno, no siempre cuentan con una calefacción adecuada. Esto afecta al bienestar, la concentración y las condiciones en las que los niños pueden aprender.</p>
       <p>Los centros educativos necesitan una climatización adecuada, sostenible y adaptada a las condiciones climáticas actuales. También necesitan instalaciones dignas, seguras y bien mantenidas.</p>
       <p><strong>No podemos pedir a nuestros hijos que aprendan en condiciones que no les permitiríamos en ningún otro espacio.</strong></p>
       <p>Una educación pública de calidad también necesita espacios dignos para aprender.</p>
       <p><strong>¡Esta reivindicación también es vuestra!</strong></p>`,

      `<h3>¿Sabías que...?</h3>
       <p><strong>No todos los colegios e institutos tienen los mismos recursos para enseñar?</strong></p>
       <p>Hay centros con laboratorios sin equipar, ordenadores obsoletos, bibliotecas sin renovar, materiales insuficientes o edificios que necesitan reformas desde hace años.</p>
       <p>Cuando faltan recursos, las posibilidades de aprender haciendo, experimentar y desarrollar nuevas habilidades también se reducen. Y muchas veces son las propias familias o los docentes quienes acaban poniendo de su bolsillo lo que la Administración no proporciona.</p>
       <p><strong>La educación pública no puede depender de cuánto dinero tenga cada centro ni de lo que puedan aportar sus familias.</strong></p>
       <p>Todos los alumnos merecen las mismas oportunidades, independientemente del instituto en el que estudien.</p>
       <p><strong>¡Esta reivindicación también es vuestra!</strong></p>`,

      `<h3>¿Sabías que...?</h3>
       <p><strong>No todos los colegios e institutos tienen los mismos recursos para enseñar?</strong></p>
       <p>Hay centros con laboratorios sin equipar, ordenadores obsoletos, bibliotecas sin renovar, materiales insuficientes o edificios que necesitan reformas desde hace años.</p>
       <p>Cuando faltan recursos, las posibilidades de aprender haciendo, experimentar y desarrollar nuevas habilidades también se reducen. Y muchas veces son las propias familias o los docentes quienes acaban poniendo de su bolsillo lo que la Administración no proporciona.</p>
       <p><strong>La educación pública no puede depender de cuánto dinero tenga cada centro ni de lo que puedan aportar sus familias.</strong></p>
       <p>Todos los alumnos merecen las mismas oportunidades, independientemente del instituto en el que estudien.</p>
       <p><strong>¡Esta reivindicación también es vuestra!</strong></p>`,

      `<h3>¿Sabías que...?</h3>
       <p><strong>Cuando un profesor se pone enfermo o causa baja, sus alumnos no deberían quedarse semanas sin clase.</strong></p>
       <p>En muchos centros de la Comunidad de Madrid, las sustituciones tardan semanas en llegar. Durante ese tiempo, los alumnos pierden horas de clase, se interrumpe el ritmo de aprendizaje y se acumulan contenidos que después resulta difícil recuperar.</p>
       <p>Además, el resto del profesorado tiene que asumir muchas veces la atención de esos grupos, aumentando la carga de trabajo y dificultando también su labor docente.</p>
       <p><strong>El derecho a la educación no debería depender de que haya o no un profesor disponible para sustituir una baja.</strong></p>
       <p>Cuando falta un docente, la Administración debe garantizar que sus alumnos sigan teniendo clase.</p>`,

      `<h3>¿Y si todo esto también fuera por tus hijos?</h3>
       <p><strong>Menos alumnos por aula. Más profesores de apoyo. Más orientadores para cuidar la salud mental. Más recursos y mejores instalaciones. Sustituciones rápidas para que ningún alumno pierda semanas de clase.</strong></p>
       <p>No son privilegios para los docentes. Son condiciones necesarias para que nuestros hijos reciban la educación que merecen.</p>
       <p><strong>El profesorado no está luchando solo por sus condiciones laborales. Está luchando por una educación pública de calidad, inclusiva y con recursos suficientes para todos.</strong></p>
       <p>Porque la educación de nuestros hijos es una responsabilidad compartida.</p>
       <p><strong>Esta lucha también es vuestra. ¿Os sumáis?</strong></p>`
    ];

    const prendas = [
      "camiseta verde", "pantalón vaquero", "calcetines", "gorro verde",
      "zapatos", "sudadera verde", "guantes", "bufanda verde"
    ];

    function cargarEstado() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return Array.isArray(data.completados) ? data.completados : [];
      } catch (_) { return []; }
    }

    let completados = new Set(cargarEstado());
    let mapa = null;
    let marcadores = {};
    let lugarActivo = null;
    let posicionReciente = null;
    let comprobando = false;

    function guardarEstado() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ completados: [...completados] }));
    }

    function normalizar(texto) {
      return texto.trim().toLocaleLowerCase("es")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:…]/g, "").replace(/\s+/g, " ");
    }

    function distanciaMetros(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rad = v => v * Math.PI / 180;
      const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function crearMuneco(elemento, nivel) {
      const template = document.getElementById("dollTemplate");
      elemento.innerHTML = template.innerHTML;
      const svg = elemento.querySelector("svg");
      svg.classList.add(`level-${Math.min(8, nivel)}`);
    }

    function actualizarMuneco() {
      const nivel = Math.min(8, completados.size);
      crearMuneco(document.getElementById("mapDoll"), nivel);
      document.getElementById("dollCaption").textContent =
        nivel === 8 ? "¡Completamente vestido!" : `${nivel} de 8 prendas`;
    }

    function actualizarProgreso() {
      document.getElementById("progress").textContent =
        `Ubicaciones completadas: ${completados.size} de ${lugares.length}`;
      actualizarMuneco();
    }

    function iconoMarcador(hecho) {
      return L.divIcon({
        className: "",
        html: `<div class="empty-marker${hecho ? " done" : ""}"></div>`,
        iconSize: [25, 25], iconAnchor: [12.5, 12.5]
      });
    }

    function iniciarMapa() {
      if (mapa) { mapa.invalidateSize(); return; }

      mapa = L.map("map", { zoomControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapa);

      lugares.forEach(lugar => {
        const marker = L.marker([lugar.lat, lugar.lng], {
          icon: iconoMarcador(completados.has(lugar.id))
        }).addTo(mapa);
        marker.on("click", () => iniciarComprobacion(lugar));
        marcadores[lugar.id] = marker;
      });

      const bounds = L.latLngBounds(lugares.map(l => [l.lat, l.lng]));
      mapa.fitBounds(bounds, { padding: [45, 45] });
      actualizarProgreso();
    }

    function actualizarEstadoGPS(texto) {
      document.getElementById("gpsStatus").textContent = texto;
    }

    function leerPosicion(callback) {
      if (!navigator.geolocation) {
        actualizarEstadoGPS("Tu navegador no permite usar la geolocalización.");
        callback(null);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => callback({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        }),
        err => {
          let msg = "No se pudo obtener tu ubicación.";
          if (err.code === 1) msg = "Has bloqueado el acceso a la ubicación. Actívalo en el navegador.";
          if (err.code === 2) msg = "No se ha podido determinar tu ubicación. Comprueba el GPS.";
          if (err.code === 3) msg = "El GPS ha tardado demasiado. Vuelve a intentarlo.";
          actualizarEstadoGPS(msg);
          callback(null);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
    }

    function evaluarPosicion(lugar, pos) {
      if (!pos) return { ok: false, texto: "No hemos podido comprobar tu ubicación." };
      const distancia = distanciaMetros(pos.lat, pos.lng, lugar.lat, lugar.lng);
      if (pos.accuracy > PRECISION_MAXIMA) {
        return {
          ok: false,
          texto: `La precisión actual del GPS es de unos ${Math.round(pos.accuracy)} m. Necesitamos una precisión de 10 m o mejor. Prueba al aire libre y vuelve a intentarlo.`
        };
      }
      if (distancia > RADIO_METROS) {
        return {
          ok: false,
          texto: `Estás aproximadamente a ${Math.round(distancia)} m del punto. Acércate hasta estar a 10 m o menos.`
        };
      }
      return { ok: true, texto: `Ubicación comprobada (precisión aproximada: ${Math.round(pos.accuracy)} m).` };
    }

    function iniciarComprobacion(lugar) {
      if (completados.has(lugar.id)) {
        actualizarEstadoGPS("Este punto ya está completado. ¡Busca otro!");
        return;
      }
      if (comprobando) return;
      comprobando = true;
      lugarActivo = lugar;
      actualizarEstadoGPS(`Comprobando si estás cerca de ${lugar.nombre}…`);
      leerPosicion(pos => {
        comprobando = false;
        if (!pos) return;
        posicionReciente = pos;
        const resultado = evaluarPosicion(lugar, pos);
        actualizarEstadoGPS(resultado.texto);
        if (resultado.ok) abrirPregunta(lugar, resultado.texto);
      });
    }

    function abrirPregunta(lugar, estado) {
      lugarActivo = lugar;
      document.getElementById("questionTitle").textContent = lugar.nombre;
      document.getElementById("questionText").textContent = lugar.pregunta;
      document.getElementById("locationStatus").textContent = estado;
      document.getElementById("answerInput").value = "";
      document.getElementById("answerFeedback").textContent = "";
      document.getElementById("questionOverlay").style.display = "flex";
      setTimeout(() => document.getElementById("answerInput").focus(), 100);
    }

    document.getElementById("answerForm").addEventListener("submit", event => {
      event.preventDefault();
      if (!lugarActivo || comprobando) return;

      const boton = document.getElementById("answerButton");
      boton.disabled = true;
      document.getElementById("answerFeedback").textContent = "Volviendo a comprobar tu ubicación…";
      comprobando = true;

      const lugar = lugarActivo;
      leerPosicion(pos => {
        comprobando = false;
        boton.disabled = false;
        if (!pos) {
          document.getElementById("answerFeedback").textContent =
            "No hemos podido verificar que sigas en el lugar. Vuelve a intentarlo.";
          return;
        }
        posicionReciente = pos;
        const resultado = evaluarPosicion(lugar, pos);
        if (!resultado.ok) {
          document.getElementById("answerFeedback").textContent = resultado.texto;
          return;
        }

        const respuesta = normalizar(document.getElementById("answerInput").value);
        const validas = lugar.respuestas.map(normalizar);
        if (!validas.includes(respuesta)) {
          document.getElementById("answerFeedback").textContent =
            "La respuesta no es correcta. ¡Vuelve a mirar a tu alrededor e inténtalo!";
          return;
        }

        completados.add(lugar.id);
        guardarEstado();
        marcadores[lugar.id].setIcon(iconoMarcador(true));
        actualizarProgreso();
        document.getElementById("questionOverlay").style.display = "none";
        mostrarMensaje(completados.size);
      });
    });

    function mostrarMensaje(numeroAcierto) {
      const esFinal = numeroAcierto === 8;
      document.getElementById("successTitle").textContent = esFinal ? "ENHORABUENA" : "Correcto";
      document.getElementById("successText").innerHTML = mensajes[numeroAcierto - 1];
      document.getElementById("successOverlay").style.display = "flex";
      document.getElementById("successOverlay").scrollTop = 0;
      document.getElementById("successContent").scrollTop = 0;
    }

    document.getElementById("continueButton").addEventListener("click", () => {
      document.getElementById("successOverlay").style.display = "none";
      lugarActivo = null;
      actualizarEstadoGPS("Selecciona otro punto del mapa para continuar.");
      if (mapa) setTimeout(() => mapa.invalidateSize(), 100);
    });

    document.getElementById("startButton").addEventListener("click", () => {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("game").style.display = "block";
      iniciarMapa();
      setTimeout(() => mapa.invalidateSize(), 100);
    });

    crearMuneco(document.getElementById("welcomeDoll"), completados.size);
  </script>
</body>
</html>
